<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24463F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="دفتر الحسابات">
<meta name="robots" content="noindex, nofollow">
<title>دفتر الحسابات | Riferimento و GBS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEEEA;--surface:#FFFFFF;--soft:#E3E7E2;--ink:#1A221F;--muted:#5D6863;--line:#D2D8D2;
  --brand:#24463F;--brand-ink:#FFFFFF;--in:#1C7350;--out:#A7382C;--rif:#94732A;--gbs:#24463F;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121715;--surface:#1A201E;--soft:#222A27;--ink:#E5EAE7;--muted:#9AA59F;--line:#2D3632;
    --brand:#7DB3A4;--brand-ink:#0F1513;--in:#5CC092;--out:#E8826F;--rif:#D3B067;--gbs:#7DB3A4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121715;--surface:#1A201E;--soft:#222A27;--ink:#E5EAE7;--muted:#9AA59F;--line:#2D3632;
  --brand:#7DB3A4;--brand-ink:#0F1513;--in:#5CC092;--out:#E8826F;--rif:#D3B067;--gbs:#7DB3A4;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Alexandria","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:20px;letter-spacing:0}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 0 var(--line)}

main{max-width:760px;margin:0 auto;padding:16px 16px 150px}
h2.sec{font-size:15px;font-weight:600;margin:28px 0 10px;display:flex;justify-content:space-between;align-items:center}
.link{border:0;background:none;color:var(--brand);font-size:13px;padding:4px}
.muted{color:var(--muted)}
.in{color:var(--in)}.out{color:var(--out)}
.empty{color:var(--muted);font-size:14px;margin:6px 0}

/* Ledger: the position of the money */
.ledger{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px}
.ledger-row{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--muted);padding:2px 0}
.ledger-row b{font-size:17px;font-weight:600}
.ledger-net{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:10px;padding-top:12px}
.ledger-net span{font-weight:500}
.ledger-net strong{font-size:30px;font-weight:700;line-height:1.2}
.ledger-net small{font-size:13px;font-weight:400;color:var(--muted)}
.ledger-due{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.ledger-due b{color:var(--ink);font-weight:600}

/* Dimension line: an architect's way of showing a share of a whole */
.dim{position:relative;margin:12px 0 8px;padding:5px 0;border-inline:1.5px solid var(--muted)}
.dim::before{content:"";position:absolute;inset-inline:0;top:50%;border-top:1px dashed var(--line)}
.dim i{display:block;position:relative;height:5px;max-width:100%}
.dim i.c{background:var(--in);margin-bottom:3px}
.dim i.s{background:var(--out)}
.dim.one i{height:7px;margin:0}

.proj{display:block;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.proj-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.proj-head b{font-weight:600;font-size:16px}
.proj-head .muted{font-size:13px}
.proj-nums{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.proj-nums b{font-size:14px;color:var(--ink);font-weight:600;margin-inline-start:3px}
.proj-nums b.in{color:var(--in)}.proj-nums b.out{color:var(--out)}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;border:1px solid currentColor}
.tag.rif{color:var(--rif)}.tag.gbs{color:var(--gbs)}
.status{font-size:11px;color:var(--muted);background:var(--soft);padding:2px 7px;border-radius:5px}

ul.tx{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
ul.tx li+li{border-top:1px solid var(--line)}
.tx-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:start;padding:11px 14px}
.tx-type{font-size:11px;font-weight:600;padding:3px 7px;border-radius:5px;background:var(--soft);white-space:nowrap}
.tx-main{min-width:0}
.tx-main b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-main small,.tx-amt small{display:block;font-size:12px;color:var(--muted)}
.tx-amt{text-align:end;font-weight:600;white-space:nowrap}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chipbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chipbar button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chipbar button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1;min-width:160px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}

.primary{background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 16px}
.danger{background:transparent;border:1px solid var(--out);color:var(--out);border-radius:10px;padding:10px 16px}

.back{border:0;background:none;color:var(--brand);padding:4px 0;font-size:14px;margin-bottom:6px}
.ph{margin-bottom:6px}
.ph h1{font-size:24px;font-weight:700;margin:4px 0 2px;line-height:1.3}
.ph p{margin:0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.grid div{background:var(--surface);padding:12px 14px}
.grid span{display:block;font-size:12px;color:var(--muted)}
.grid b{font-size:17px;font-weight:600}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:320px}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--muted);font-size:12px}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:end;white-space:nowrap}
tfoot td{font-weight:600}

.bars{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px}
.bar{padding:9px 0}
.bar+.bar{border-top:1px solid var(--line)}
.bar-top{display:flex;justify-content:space-between;font-size:14px}
.bar-top b{font-weight:600}
.bar .dim{margin:8px 0 2px}

.note{font-size:12px;color:var(--muted);margin-top:22px;line-height:1.7}

.tabs{position:fixed;bottom:0;inset-inline:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;padding:12px 2px 13px;font-size:12.5px;color:var(--muted);border-top:2px solid transparent}
.tabs button.on{color:var(--ink);font-weight:600;border-top-color:var(--brand)}
.fab{position:fixed;z-index:7;inset-inline-end:16px;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--brand);color:var(--brand-ink);border:0;border-radius:14px;padding:13px 18px;font-weight:600;font-size:15px;box-shadow:0 6px 18px rgba(20,40,34,.28)}
@media (min-width:800px){.fab{inset-inline-end:calc(50% - 364px)}}

dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:100%;max-width:560px;margin:auto auto 0;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto}
@media (min-width:600px){dialog{margin:auto;border-radius:16px}}
dialog::backdrop{background:rgba(10,16,14,.45)}
.form{padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.form h3{margin:0 0 14px;font-size:18px;font-weight:600}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.f input.big{font-size:24px;font-weight:600;padding:8px 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.typechips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;border:0;padding:0}
.typechips label{position:relative}
.typechips input{position:absolute;opacity:0;inset:0}
.typechips span{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:13px}
.typechips input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.typechips input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.actions{display:flex;gap:8px;justify-content:flex-start;margin-top:6px}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 14px;font-size:14px}
.detail dt{color:var(--muted)}
.detail dd{margin:0}

.toast{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.top-tools{display:flex;align-items:center;gap:8px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:34px;font-size:16px;line-height:1;color:var(--ink)}
.icon-btn[aria-busy="true"]{opacity:.5}
body.locked .tabs,body.locked .fab,body.locked .top-tools{display:none}
.gate{max-width:420px;margin:48px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 22px;text-align:center}
.gate h1{font-size:22px;margin:0 0 6px}
.gate p{color:var(--muted);font-size:14px;margin:0 0 20px}
.gate #gbtn{display:flex;justify-content:center;min-height:44px}
.gate .msg{margin-top:16px;font-size:13px;color:var(--out);min-height:1em}
.gate .msg.ok{color:var(--muted)}
.gate code{font-size:12px;background:var(--soft);padding:2px 6px;border-radius:5px;direction:ltr;display:inline-block}
[hidden]{display:none!important}
.cert-sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
.cs-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:12px}
.cs-h b{display:block;font-size:16px}.cs-h small{color:var(--muted);font-size:13px}
.cs-no{font-size:20px;font-weight:700;white-space:nowrap}
.cs-meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0 0 12px}.cs-meta dt{color:var(--muted)}.cs-meta dd{margin:0}
.cs-meta input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 8px}
.cs-t{min-width:560px}
.cs-sum{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:14px 0 0;font-size:14px}.cs-sum dt{color:var(--muted)}.cs-sum dd{margin:0;text-align:end;font-weight:600}
.cs-sum .net{font-size:17px;font-weight:700;color:var(--ink);border-top:1px solid var(--line);padding-top:8px}
.cs-sign{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:26px;text-align:center;font-size:13px}.cs-sign span{display:block;color:var(--muted)}
.cs-sign b{display:block;border-top:1px solid var(--muted);margin-top:34px;padding-top:4px;font-weight:500;min-height:1.6em}
.ci{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.ci-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}.ci-h .muted{font-size:12px}
.ci-row{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px;align-items:end;font-size:12px;color:var(--muted)}.ci-row b{display:block;color:var(--ink);font-size:15px}
.ci-in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;font-size:16px;color:var(--ink);margin-top:2px}
.st{font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap}.st-d{background:#F3E7C9;color:#6E500C}.st-a{background:#D9E8F5;color:#1D4E7A}.st-p{background:#D7EDE2;color:#1C6B47}
tr.tap{cursor:pointer}
@media print{
  body{background:#fff;color:#000}
  .top,.tabs,.fab,.toast,body::before{display:none!important}
  body.cert-page #view>*:not(.cert-sheet){display:none!important}
  :root{padding:0}main{padding:0;max-width:none}
  .cert-sheet{border:0;padding:0;margin:0}
  .tablewrap{overflow:visible;border:1px solid #999}.cs-t{min-width:0;font-size:12px}
}
button[disabled]{opacity:.6;cursor:wait}
.errbox{background:var(--surface);border:1px solid var(--out);border-radius:12px;padding:16px;color:var(--out);font-size:14px}
.errbox button{margin-top:10px}
a.ghost{display:inline-block;text-decoration:none;color:var(--ink)}
</style>
</head>
<body class="locked">
<header class="top">
  <div class="top-in">
    <div class="brand">دفتر الحسابات<small>Riferimento و GBS</small></div>
    <div class="top-tools">
      <div class="seg" id="seg">
        <button data-company="all" aria-pressed="true">الشركتين</button>
        <button data-company="Riferimento" aria-pressed="false">Riferimento</button>
        <button data-company="GBS" aria-pressed="false">GBS</button>
      </div>
      <button class="icon-btn" id="refresh" data-act="refresh" aria-label="تحديث البيانات" title="تحديث البيانات">↻</button>
    </div>
  </div>
</header>

<main id="view"></main>

<button class="fab" id="fab" data-act="newTx">+ تسجيل حركة</button>

<nav class="tabs" aria-label="الأقسام">
  <div class="tabs-in">
    <button data-tab="home" class="on">الرئيسية</button>
    <button data-tab="projects">المشاريع</button>
    <button data-tab="certs">المستخلصات</button>
    <button data-tab="txns">الحركات</button>
    <button data-tab="reports">التقارير</button>
  </div>
</nav>

<dialog id="sheet"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* =========================================================
   الإعدادات: املا السطرين الأولانيين بس
   ========================================================= */
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbyE0JFbbUOthlBNWQgjEgOZ_7dm1GG6Y_MpG4xH6plCkOmbPu0nhA7IRlksyfTfvs0s8A/exec",           // رابط الـ Web app من Apps Script (بينتهي بـ /exec)
  GOOGLE_CLIENT_ID: "251398468688-61kpium1uvarn7io7jf96cuvsn478d0t.apps.googleusercontent.com",  // الـ Client ID من Google Cloud
  SHEET_URL: "https://docs.google.com/spreadsheets/d/1yypC5fua6JmPj_Lw6koQtiBoCtWF2Nxb1yAjPsYMFlw/edit"
};
/* ========================================================= */

(function(){
"use strict";
const COMPANIES=["Riferimento","GBS"];
const CLS={Riferimento:"rif",GBS:"gbs"};
const TYPES=["تحصيل","مواد","مقاول / عمالة","مصاريف مكتب","أخرى"];
const IN="تحصيل",ACTIVE="جاري",DONE="منتهي";
const SKEY="daftar-session";
const S={company:"all",tab:"home",projectId:null,txFilter:"all",q:"",projects:[],txns:[],users:[],me:null,contractors:[],items:[],certs:[],lines:[],lists:{officeCats:[]},cp:null,certId:null,certNew:null,officeMonth:null,loaded:false,loading:false,loadErr:"",session:null,email:"",authMsg:"",authOk:false};
const ENG="مهندس",EXEC="مدير تنفيذي";
const isEng=()=>!!(S.me&&S.me.role===ENG);
const isExec=()=>!!(S.me&&S.me.role===EXEC);
const isAdmin=()=>!!S.me&&!isEng()&&!isExec();
const myCompanies=()=>(S.me&&S.me.companies&&S.me.companies.length)?S.me.companies:COMPANIES;
const userName=e=>{const u=S.users.find(x=>x.email===e);return u&&u.name?u.name:(e||"")};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/٫/g,".").replace(/[,،\s]/g,""));return isFinite(n)?n:0};
const raw=n=>Math.round(n||0).toLocaleString("en-US");
const fmt=n=>`<bdi dir="ltr">${raw(n)}</bdi>`;
const sg=(n,isIn)=>`<bdi dir="ltr">${isIn?"+":"−"}${raw(n)}</bdi>`;
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const fmtDate=d=>{if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d))return esc(d||"");const [y,m,dd]=d.split("-");return dd+"/"+m+"/"+y};
const pct=(a,b)=>b>0?Math.max(0,Math.min(100,a/b*100)):0;
const byDate=(a,b)=>(b.date||"").localeCompare(a.date||"")||String(b.id).localeCompare(String(a.id));
const cls=c=>CLS[c]||"";

let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600)}

/* ---------- API ---------- */
function loadSession(){try{const s=JSON.parse(localStorage.getItem(SKEY)||"null");if(s&&s.session){S.session=s.session;S.email=s.email||""}}catch(e){}}
function saveSession(){try{localStorage.setItem(SKEY,JSON.stringify({session:S.session,email:S.email}))}catch(e){}}
function endSession(msg){S.session=null;S.email="";S.loaded=false;S.projects=[];S.txns=[];S.users=[];S.me=null;try{localStorage.removeItem(SKEY)}catch(e){}S.authMsg=msg||"";S.authOk=false;closeSheet();render()}

async function api(action,data){
  let res;
  try{res=await fetch(CONFIG.API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,session:S.session,data:data||{}})})}
  catch(e){throw new Error("مفيش اتصال بالسيرفر. اتأكد من الإنترنت وجرّب تاني")}
  let j;try{j=await res.json()}catch(e){throw new Error("رد غير متوقع من السيرفر. اتأكد من رابط Apps Script")}
  if(!j.ok){
    if(action!=="login"&&(j.error==="auth"||j.error==="forbidden"))endSession(j.message);
    const er=new Error(j.message||"حصل خطأ، جرّب تاني");er.code=j.error;throw er;
  }
  return j.result;
}

async function load(quiet){
  if(S.loading)return;S.loading=true;S.loadErr="";
  const rb=$("#refresh");rb.setAttribute("aria-busy","true");
  if(!quiet)render();
  try{const r=await api("list");S.projects=r.projects||[];S.txns=r.txns||[];S.users=r.users||[];S.me=r.me||null;S.contractors=r.contractors||[];S.items=r.items||[];S.certs=r.certs||[];S.lines=r.lines||[];S.lists=r.lists||{officeCats:[]};S.loaded=true;$("#fab").textContent=isAdmin()?"+ تسجيل حركة":"+ تسجيل مصروف";if(!isAdmin()&&S.txFilter===IN)S.txFilter="all";
    const mc=myCompanies();document.querySelectorAll("[data-company]").forEach(b=>{b.hidden=b.dataset.company!=="all"&&mc.indexOf(b.dataset.company)<0});$("#seg").hidden=mc.length<2}
  catch(e){if(S.session)S.loadErr=e.message}
  finally{S.loading=false;rb.removeAttribute("aria-busy");if(S.session)render()}
}

async function busy(btn,fn){
  const old=btn?btn.textContent:"";if(btn){btn.disabled=true;btn.textContent="جاري الحفظ…"}
  try{return await fn()}catch(e){toast(e.message);return null}
  finally{if(btn&&btn.isConnected){btn.disabled=false;btn.textContent=old}}
}
function upsert(list,key,obj){const i=list.findIndex(x=>x[key]===obj[key]);if(i>=0)list[i]=obj;else list.push(obj)}

const inScope=x=>S.company==="all"||x.company===S.company;
function totals(ts){let i=0,o=0;for(const t of ts){if(t.type===IN)i+=t.amount||0;else o+=t.amount||0}return{i,o,net:i-o}}
function pstats(p){const ts=S.txns.filter(t=>t.project===p.code);const {i,o}=totals(ts);const c=p.contract||0;return{c,collected:i,spent:o,due:Math.max(0,c-i),profit:i-o,expected:c-o,ts}}
const projName=code=>{if(!code)return"عام";const p=S.projects.find(x=>x.code===code);return p?p.name:code};

  let prevV=0,curV=0;

    S.lines.forEach(l=>{if(l.item!==it.id)return;if(earlier.has(l.cert))prev+=l.qty;if(l.cert===cert.id)cur+=l.qty});

  const mts=ts.filter(t=>(t.date||"").startsWith(S.officeMonth)),tot=mts.reduce((a,t)=>a+t.amount,0),by={};
  mts.forEach(t=>{const k=t.sub||"بدون بند";by[k]=(by[k]||0)+t.amount});
  const bars=Object.keys(by).sort((a,b)=>by[b]-by[a]).map(k=>`<div class="bar"><div class="bar-top"><span>${esc(k)}</span><b class="out">${fmt(by[k])}</b></div><div class="dim one" aria-hidden="true"><i class="s" style="width:${pct(by[k],tot)}%"></i></div></div>`).join("");
  const mrow=months.slice(0,6).map(m=>`<tr><td>${m.slice(5)}/${m.slice(0,4)}</td><td class="n out">${fmt(ts.filter(t=>t.date.startsWith(m)).reduce((a,t)=>a+t.amount,0))}</td></tr>`).join("");
  return `<h2 class="sec">مصروفات المكتب</h2><div class="chipbar">${months.slice(0,6).map(m=>`<button data-act="officeMonth" data-v="${m}" aria-pressed="${m===S.officeMonth}">${m.slice(5)}/${m.slice(0,4)}</button>`).join("")}</div>
   <div class="bars"><div class="bar"><div class="bar-top"><span>إجمالي الشهر</span><b class="out">${fmt(tot)}</b></div></div>${bars}</div>
   <h2 class="sec">المكتب شهر بشهر</h2><div class="tablewrap"><table><thead><tr><th>الشهر</th><th class="n">المصروف</th></tr></thead><tbody>${mrow}</tbody></table></div>`;
}

function viewReportsEng(){
  const ts=S.txns.filter(inScope);const {o}=totals(ts);
  const byType={};ts.forEach(t=>{byType[t.type]=(byType[t.type]||0)+t.amount});
  const typeBars=Object.keys(byType).sort((a,b)=>byType[b]-byType[a]).map(k=>`<div class="bar"><div class="bar-top"><span>${esc(k)}</span><b class="out">${fmt(byType[k])}</b></div><div class="dim one" aria-hidden="true"><i class="s" style="width:${pct(byType[k],o)}%"></i></div></div>`).join("");
  const parties={};ts.filter(t=>t.party).forEach(t=>{parties[t.party]=(parties[t.party]||0)+t.amount});
  const pRows=Object.keys(parties).sort((a,b)=>parties[b]-parties[a]).slice(0,8).map(k=>`<tr><td>${esc(k)}</td><td class="n out">${fmt(parties[k])}</td></tr>`).join("");
  return `<h2 class="sec" style="margin-top:4px">مصروفات مشاريعي حسب النوع</h2>${typeBars?`<div class="bars">${typeBars}</div>`:'<p class="empty">لسه مفيش مصروفات.</p>'}
  <h2 class="sec">أكبر الموردين والمقاولين</h2>${pRows?`<div class="tablewrap"><table><thead><tr><th>الطرف</th><th class="n">إجمالي المدفوع</th></tr></thead><tbody>${pRows}</tbody></table></div>`:'<p class="empty">لسه مفيش بيانات.</p>'}
  ${isExec()?officeSection():""}
  <div class="btnrow" style="margin-top:22px"><button class="ghost" data-act="logout">تسجيل الخروج</button></div>
  <p class="note">داخل بـ <bdi>${esc(S.email)}</bdi> (${esc(S.me&&S.me.role===EXEC?"مدير تنفيذي":"مهندس موقع")}).</p>`;
}

function render(){
  const locked=!S.session;
  document.body.classList.toggle("locked",locked);
  if(locked){$("#view").innerHTML=gateHtml();initGoogle();return}
  document.querySelectorAll("[data-company]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.company===S.company)));
  const navTab=S.tab==="project"||S.tab==="cp"?"projects":S.tab==="cert"||S.tab==="contractors"?"certs":S.tab;
  document.body.classList.toggle("cert-page",S.tab==="cert");
  document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("on",b.dataset.tab===navTab));
  const views={home:viewHome,projects:viewProjects,project:viewProject,txns:viewTxns,reports:viewReports,certs:viewCerts,cp:viewCP,cert:viewCert,contractors:viewContractors};
  $("#view").innerHTML=(views[S.tab]||viewHome)();
}

/* ---------- Sheets / forms ---------- */
const sheet=$("#sheet");
function openSheet(html){sheet.innerHTML=html;if(!sheet.open){try{sheet.showModal()}catch(e){sheet.setAttribute("open","")}}const f=sheet.querySelector("[autofocus]");if(f)f.focus()}
function closeSheet(){if(sheet.open)sheet.close();sheet.innerHTML=""}
sheet.addEventListener("click",e=>{if(e.target===sheet)closeSheet()});

function projOptions(company,sel){
  const ps=S.projects.filter(p=>p.company===company&&(p.status!==DONE||p.code===sel));
  return `<option value="">عام (بدون مشروع)</option>`+ps.map(p=>`<option value="${esc(p.code)}" ${p.code===sel?"selected":""}>${esc(p.name)}</option>`).join("");
}
const engProjOptions=sel=>{const ps=S.projects.filter(p=>p.status!==DONE||p.code===sel);return (ps.length>1&&!sel?'<option value="">اختار المشروع</option>':"")+ps.map(p=>`<option value="${esc(p.code)}" ${p.code===sel?"selected":""}>${esc(p.name)}</option>`).join("")};
const compOptions=(sel,scoped)=>(scoped?myCompanies():COMPANIES).map(c=>`<option value="${c}" ${c===sel?"selected":""}>${c}</option>`).join("");
function txForm(t){
  t=t||{};const eng=isEng(),ex=isExec();const mc=myCompanies();
  const company=t.company||(S.company!=="all"&&mc.indexOf(S.company)>=0?S.company:mc[0]);const type=t.type||(isAdmin()?IN:"مواد");
  const types=isAdmin()?TYPES:TYPES.filter(x=>x!==IN);
  const parties=[...new Set(S.txns.map(x=>x.party).filter(Boolean))].slice(0,300);
  return `<div class="form" id="txf" data-id="${esc(t.id||"")}">
    <h3>${t.id?"تعديل حركة":(isAdmin()?"تسجيل حركة":"تسجيل مصروف")}</h3>
    <fieldset class="typechips"><legend class="muted" style="font-size:12px;margin-bottom:6px">نوع الحركة</legend>${types.map(k=>`<label><input type="radio" name="type" value="${esc(k)}" ${type===k?"checked":""}><span>${esc(k)}</span></label>`).join("")}</fieldset>
    <label class="f" id="subWrap" ${type!==OFFICE?"hidden":""}><span>بند مصاريف المكتب</span><select name="sub"><option value="">اختار البند</option>${(S.lists.officeCats||[]).map(c=>`<option ${t.sub===c?"selected":""}>${esc(c)}</option>`).join("")}</select></label>
    <label class="f"><span>المبلغ (ج.م)</span><input class="big" name="amount" inputmode="decimal" autocomplete="off" value="${t.amount?esc(t.amount):""}" autofocus></label>
    ${eng?`<label class="f"><span>المشروع</span><select name="project">${engProjOptions(t.project)}</select></label>`:`<div class="row2">
      <label class="f"><span>الشركة</span><select name="company">${compOptions(company,ex)}</select></label>
      <label class="f"><span>المشروع</span><select name="project">${projOptions(company,t.project)}</select></label>
    </div>`}
    <label class="f"><span>الطرف (عميل، مورد، مقاول)</span><input name="party" list="partylist" value="${esc(t.party||"")}" autocomplete="off"></label>
    <datalist id="partylist">${parties.map(p=>`<option value="${esc(p)}">`).join("")}</datalist>
    <div class="row2">
      <label class="f"><span>التاريخ</span><input type="date" name="date" value="${esc(t.date||today())}"></label>
      <label class="f"><span>رقم الفاتورة / الإيصال</span><input name="invoice" value="${esc(t.invoice||"")}"></label>
    </div>
    <label class="f"><span>ملاحظات</span><textarea name="note" rows="2">${esc(t.note||"")}</textarea></label>
    <div class="actions"><button type="button" class="primary" data-act="saveTx">حفظ الحركة</button><button type="button" class="ghost" data-act="close">إلغاء</button></div>
  </div>`;
}
function projForm(p){
  p=p||{};const mc=isAdmin()?COMPANIES:myCompanies();const company=p.company||(S.company!=="all"&&mc.indexOf(S.company)>=0?S.company:mc[0]);
  return `<div class="form" id="pf" data-code="${esc(p.code||"")}" data-status="${esc(p.status||ACTIVE)}">
    <h3>${p.code?"تعديل المشروع":"مشروع جديد"}</h3>
    <label class="f"><span>اسم المشروع</span><input name="name" value="${esc(p.name||"")}" autofocus autocomplete="off"></label>
    <label class="f"><span>العميل</span><input name="client" value="${esc(p.client||"")}" autocomplete="off"></label>
    <div class="row2">
      <label class="f"><span>الشركة</span><select name="company" ${p.code?"disabled":""}>${compOptions(company,isExec())}</select></label>
      ${isAdmin()?`<label class="f"><span>قيمة العقد (ج.م)</span><input name="contract" inputmode="decimal" value="${p.contract?esc(p.contract):""}" autocomplete="off"></label>`:'<span></span>'}
    </div>
    <fieldset class="f engs" style="border:0;padding:0;margin:0 0 12px"><legend class="muted" style="font-size:12px;margin-bottom:6px">مهندسين الموقع المسؤولين</legend>${engChecks(p.engineers||[])}</fieldset>
    <div class="actions"><button type="button" class="primary" data-act="saveProject">حفظ المشروع</button><button type="button" class="ghost" data-act="close">إلغاء</button></div>
  </div>`;
}
function engChecks(sel){
  const engs=S.users.filter(u=>u.role===ENG);
  if(!engs.length)return '<p class="empty" style="margin:0">ضيف المهندسين الأول في تاب "المستخدمين" في الشيت، ودورهم "مهندس".</p>';
  return engs.map(u=>`<label style="display:flex;gap:8px;align-items:center;padding:4px 0"><input type="checkbox" name="eng" value="${esc(u.email)}" ${sel.indexOf(u.email)>=0?"checked":""}><span>${esc(u.name||u.email)} <small class="muted"><bdi>${esc(u.email)}</bdi></small></span></label>`).join("");
}
function txDetail(t){
  const isIn=t.type===IN;
  return `<div class="form detail"><h3 class="${isIn?"in":"out"}">${sg(t.amount,isIn)} ج.م</h3>
  <dl><dt>النوع</dt><dd>${esc(t.type)}</dd><dt>الشركة</dt><dd>${esc(t.company)}</dd><dt>المشروع</dt><dd>${esc(projName(t.project))}</dd><dt>الطرف</dt><dd>${esc(t.party||"—")}</dd><dt>التاريخ</dt><dd>${fmtDate(t.date)}</dd><dt>رقم الفاتورة</dt><dd>${esc(t.invoice||"—")}</dd>${t.sub?`<dt>بند المكتب</dt><dd>${esc(t.sub)}</dd>`:""}<dt>ملاحظات</dt><dd>${esc(t.note||"—")}</dd>${t.by?`<dt>سجّلها</dt><dd>${esc(isAdmin()?userName(t.by):t.by)}</dd>`:""}</dl>
  <div class="actions">${isEng()||(isExec()&&t.type===IN)?"":`<button type="button" class="primary" data-act="editTx" data-id="${esc(t.id)}">تعديل</button><button type="button" class="danger" data-act="delTx" data-id="${esc(t.id)}">حذف</button>`}<button type="button" class="ghost" data-act="close">قفل</button></div></div>`;
}
const obj_sub=f=>{const t=f.querySelector('[name="type"]:checked');return t&&t.value===OFFICE?val(f,"sub"):""};
const val=(root,n)=>{const el=root.querySelector(`[name="${n}"]`);return el?el.value.trim():""};

async function saveTx(btn){
  const f=$("#txf");const amount=num(val(f,"amount"));
  if(amount<=0){toast("اكتب المبلغ");f.querySelector('[name="amount"]').focus();return}
  const typeEl=f.querySelector('[name="type"]:checked');
  if(isEng()&&!val(f,"project")){toast("اختار المشروع");return}
  const obj={id:f.dataset.id||"",type:typeEl?typeEl.value:IN,amount,company:val(f,"company")||((S.projects.find(p=>p.code===val(f,"project"))||{}).company||""),project:val(f,"project"),sub:obj_sub(f),party:val(f,"party"),date:val(f,"date")||today(),invoice:val(f,"invoice"),note:val(f,"note")};
  const saved=await busy(btn,()=>api("saveTxn",obj));
  if(saved){upsert(S.txns,"id",saved);closeSheet();render();toast(obj.id?"اتعدّلت الحركة":"اتسجلت الحركة")}
}
async function saveProject(btn){
  const f=$("#pf");const name=val(f,"name");
  if(!name){toast("اكتب اسم المشروع");f.querySelector('[name="name"]').focus();return}
  const code=f.dataset.code;const old=S.projects.find(x=>x.code===code);
  const engineers=[...f.querySelectorAll('[name="eng"]:checked')].map(x=>x.value);
  const obj={code,name,client:val(f,"client"),company:old?old.company:val(f,"company"),contract:isAdmin()?num(val(f,"contract")):0,status:f.dataset.status||ACTIVE,engineers};
  const saved=await busy(btn,()=>api("saveProject",obj));
  if(saved){upsert(S.projects,"code",saved);closeSheet();if(!code){S.tab="project";S.projectId=saved.code}render();toast(code?"اتعدّل المشروع":"اتضاف المشروع")}
}

/* ---------- Events ---------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-company],[data-tab],[data-act]");if(!b||b.disabled)return;
  if(b.dataset.company){S.company=b.dataset.company;if(S.tab==="project")S.tab="projects";render();return}
  if(b.dataset.tab){S.tab=b.dataset.tab;render();window.scrollTo(0,0);return}
  const a=b.dataset.act,id=b.dataset.id;
  switch(a){
    case "refresh":load();break;
    case "tab":S.tab=b.dataset.v;render();window.scrollTo(0,0);break;
    case "open":S.tab="project";S.projectId=id;render();window.scrollTo(0,0);break;
    case "newTx":{
      if(!S.loaded){toast("استنى البيانات تحمّل");break}
      const pc=b.dataset.project||(S.tab==="project"?S.projectId:"");const p=S.projects.find(x=>x.code===pc);
      openSheet(txForm(p?{company:p.company,project:p.code,type:isAdmin()?IN:"مواد"}:null));break}
    case "newProject":if(isAdmin()||isExec())openSheet(projForm());break;
    case "editProject":openSheet(projForm(S.projects.find(x=>x.code===id)));break;
    case "toggleDone":{
      const p=S.projects.find(x=>x.code===id);if(!p)break;
      const saved=await busy(b,()=>api("saveProject",Object.assign({},p,{status:p.status===DONE?ACTIVE:DONE})));
      if(saved){upsert(S.projects,"code",saved);render();toast(saved.status===DONE?"المشروع اتعلّم منتهي":"المشروع رجع جاري")}break}
    case "delProject":{
      if(S.txns.some(t=>t.project===id)){toast("احذف حركات المشروع الأول");break}
      if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="اضغط تاني لتأكيد الحذف";break}
      const ok=await busy(b,()=>api("deleteProject",{code:id}));
      if(ok){S.projects=S.projects.filter(x=>x.code!==id);S.tab="projects";render();toast("اتحذف المشروع")}break}
    case "tx":{const t=S.txns.find(x=>x.id===id);if(t)openSheet(txDetail(t));break}
    case "editTx":openSheet(txForm(S.txns.find(x=>x.id===id)));break;
    case "delTx":{
      if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="اضغط تاني للتأكيد";break}
      const ok=await busy(b,()=>api("deleteTxn",{id}));
      if(ok){S.txns=S.txns.filter(x=>x.id!==id);closeSheet();render();toast("اتحذفت الحركة")}break}
    case "saveTx":saveTx(b);break;
    case "saveProject":saveProject(b);break;
    case "close":closeSheet();break;
    case "txFilter":S.txFilter=b.dataset.v;render();break;
    case "openCP":S.cp={p:b.dataset.p,c:b.dataset.c};S.tab="cp";render();window.scrollTo(0,0);break;
    case "newItem":openSheet(itemForm(null,{p:b.dataset.p,c:b.dataset.c}));syncItemForm();break;
    case "editItem":{const it=S.items.find(x=>x.id===id);if(it){openSheet(itemForm(it));syncItemForm()}break}
    case "saveItem":{
      const f=$("#itf");let con=f.querySelector('[name="contractor"]').value;
      const mode=(f.querySelector('[name="mode"]:checked')||{}).value||MODE_UNIT;
      if(!val(f,"desc")){toast("اكتب اسم البند");break}
      if(!(num(val(f,"price"))>0)&&!f.dataset.id){toast(mode===MODE_LUMP?"اكتب قيمة المقطوعية":"اكتب سعر الوحدة");break}
      if(con==="__new"&&!val(f,"cname")){toast("اكتب اسم المقاول");break}
      const res=await busy(b,async()=>{
        if(con==="__new"){const c=await api("saveContractor",{name:val(f,"cname"),specialty:val(f,"cspec"),phone:val(f,"cphone")});upsert(S.contractors,"code",c);con=c.code}
        const old=S.items.find(x=>x.id===f.dataset.id);
        return api("saveItem",{id:f.dataset.id,project:f.dataset.p,contractor:con,desc:val(f,"desc"),mode,unit:val(f,"unit"),price:old&&f.querySelector('[name="price"]').disabled?old.price:num(val(f,"price")),qty:num(val(f,"qty"))})});
      if(res){upsert(S.items,"id",res);closeSheet();S.cp={p:res.project,c:res.contractor};S.tab="cp";render();toast("اتحفظ البند")}break}
    case "delItem":{
      if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="اضغط تاني للتأكيد";break}
      const ok=await busy(b,()=>api("deleteItem",{id}));if(ok){S.items=S.items.filter(x=>x.id!==id);closeSheet();render();toast("اتمسح البند")}break}
    case "newContractor":openSheet(contractorForm());break;
    case "editContractor":openSheet(contractorForm(S.contractors.find(x=>x.code===id)));break;
    case "saveContractor":{
      const f=$("#cf");if(!val(f,"name")){toast("اكتب اسم المقاول");break}
      const res=await busy(b,()=>api("saveContractor",{code:f.dataset.code,name:val(f,"name"),specialty:val(f,"specialty"),phone:val(f,"phone")}));
      if(res){upsert(S.contractors,"code",res);closeSheet();render();toast("اتحفظ")}break}
    case "newCert":{
      const cs=pairCerts(S.cp.p,S.cp.c);
      S.certNew={id:"__new",project:S.cp.p,contractor:S.cp.c,no:cs.reduce((m,x)=>Math.max(m,x.no),0)+1,date:today(),status:DRAFT,deductions:0,deductNote:""};
      S.certId=null;S.tab="cert";render();window.scrollTo(0,0);break}
    case "openCert":S.certNew=null;S.certId=id;S.tab="cert";render();window.scrollTo(0,0);break;
    case "saveCert":{const pl=certPayload();if(!pl.lines.length){toast("اكتب كمية لبند واحد على الأقل");break}
      const r=await busy(b,()=>api("saveCert",pl));if(r)await afterCert(r.id,"اتحفظ المستخلص");break}
    case "approveCert":{const pl=certPayload();if(!pl.lines.length){toast("اكتب كمية لبند واحد على الأقل");break}
      const r=await busy(b,async()=>{const x=await api("saveCert",pl);await api("approveCert",{id:x.id});return x});if(r)await afterCert(r.id,"اتعتمد المستخلص");break}
    case "payCert":{
      if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="اضغط تاني لتأكيد الصرف";break}
      const r=await busy(b,()=>api("payCert",{id:S.certId,date:today()}));if(r)await afterCert(S.certId,"اتصرف واتسجل كمصروف");break}
    case "unapproveCert":{const r=await busy(b,()=>api("unapproveCert",{id:S.certId}));if(r)await afterCert(S.certId,"رجع مسودة");break}
    case "delCert":{
      if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="اضغط تاني للتأكيد";break}
      const cert=curCert();const r=await busy(b,()=>api("deleteCert",{id:S.certId}));
      if(r){S.cp={p:cert.project,c:cert.contractor};S.tab="cp";S.certId=null;await load(true);toast("اتمسح المستخلص")}break}
    case "print":window.print();break;
    case "officeMonth":S.officeMonth=b.dataset.v;render();break;
    case "logout":{try{await api("logout")}catch(e){}if(window.google&&google.accounts&&google.accounts.id)google.accounts.id.disableAutoSelect();endSession("");break}
  }
});
document.addEventListener("change",e=>{
  if(e.target.closest&&e.target.closest("#itf"))syncItemForm();
  if(e.target.matches('#txf [name="type"]')){const w=$("#subWrap");if(w)w.hidden=e.target.value!==OFFICE}
  if(e.target.matches('#txf [name="company"]'))$('#txf [name="project"]').innerHTML=projOptions(e.target.value,"");
});
document.addEventListener("input",e=>{
  if(e.target.matches(".ci-in,#ded"))liveCert();
  if(e.target.id==="q"){S.q=e.target.value;const l=$("#txlist");if(l)l.innerHTML=txListHtml()}
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.session&&S.loaded&&!sheet.open&&S.tab!=="cert")load(true)});

/* ---------- Start ---------- */
loadSession();render();if(S.session)load();
})();
</script>
